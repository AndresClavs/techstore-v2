# Despliegue gratuito: servicio web Render (plan free) + MySQL externo (Aiven, plan gratuito).
# La versión con MySQL privado de pago en Render está en deploy/render.paid.yaml.
services:
  - type: web
    name: techstore-app
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci --include=dev && npm run prisma:generate
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_URL
        value: https://andresclavs.github.io
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: AUTO_SEED
        value: "false"
      - key: EMISOR_RUC
        value: "9999999999001"
      - key: TX_TIMEOUT_MS
        value: "30000"
